syntax = "proto3";
package neoutl.v1;

message SystemSettings {
  bool autosave_enabled = 1;
  int32 autosave_interval_sec = 2;
  bool theme_dark = 3;
  string theme_id = 4;
  string easing_engine_id = 5;
  int32 ui_scale_percent = 6;
  int32 worker_threads = 7;
  int32 audio_max_block_size = 8;
  int32 decode_backend = 9;
  bool default_snap = 10;
  int32 magnetic_snap_range = 11;
  reserved 12, 13;
  bool check_update_on_startup = 14;
  bool crash_reporting_enabled = 15;
  int32 max_group_chain_depth = 16;
  int32 hw_decode_extra_frames = 17;
  repeated string hw_device_type_priority = 18;
  repeated CodecDecodeOverride codec_decode_overrides = 19;
}

message CodecDecodeOverride {
  string codec_kind = 1;
  bool force_sw_decode = 2;
  bool custom_priority_enabled = 3;
  repeated string hw_device_type_priority = 4;
}

message AudioPluginCatalogEntry {
  int32 format = 1;
  string name = 2;
  string vendor = 3;
  string plugin_id = 4;
  string path = 5;
}

message AudioPluginSettings {
  repeated string scan_paths = 1;
  repeated string disabled_plugin_ids = 2;
  repeated AudioPluginCatalogEntry cached_catalog = 3;
  bool auto_detect_system = 4;
}
